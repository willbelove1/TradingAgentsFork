name: Python Tests

on:
  push:
    branches: [ main ] # Or your primary branch e.g., master, dev
  pull_request:
    branches: [ main ] # Or your primary branch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Test on multiple Python versions

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install test dependencies if they are separate (e.g., in requirements-dev.txt or via pyproject.toml extras)
        # If using pyproject.toml extras like [project.optional-dependencies.test]:
        pip install .[test]
        # If pytest and pytest-mock are in requirements.txt, the above pip install .[test] might not be needed
        # or could be redundant. Ensure your dependencies are correctly specified.
        # If requirements.txt already includes pytest and pytest-mock, then just `pip install -r requirements.txt` is enough.

    - name: Run tests with pytest
      run: |
        pytest tests/
      # To run with coverage:
      # run: |
      #   pip install pytest-cov
      #   pytest --cov=tradingagents --cov-report=xml tests/

    # Optional: Upload coverage reports if generated
    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v3
    #   with:
    #     token: ${{ secrets.CODECOV_TOKEN }} # Optional: if your repo is private on Codecov
    #     files: coverage.xml # Path to your coverage report
    #     fail_ci_if_error: true
    #     verbose: true
