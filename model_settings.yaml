# Configuration for LLM provider and specific models for agents/components

# --- Default Top-Level LLM Provider ---
# This provider will be used if an agent/component doesn't specify its own.
llm_provider: "google"

# --- Default model names for the TOP-LEVEL llm_provider ---
# (e.g., if llm_provider is "google", these are Gemini models)
default_text_model: "gemini-1.5-flash"
default_embedding_model: "models/embedding-001"
default_image_model: "gemini-1.5-flash" # If vision capabilities are used by default provider

# --- Provider-Specific Configurations ---
# Contains settings unique to each provider that might be used by their clients.
# The BaseLLMClient factory (get_llm_client) will pass the relevant sub-config
# to the specific client's constructor.

google_config: # Settings for Google Gemini provider
  api_keys:
    - "YOUR_GEMINI_API_KEY_1_FROM_YAML" # Replace with your actual key or use env vars
    # - "YOUR_GEMINI_API_KEY_2_FROM_YAML"
    # Add more keys here if needed. Env var GOOGLE_API_KEY can act as a single fallback.
  default_text_model: "gemini-1.5-flash" # Default model for Google provider
  default_embedding_model: "models/embedding-001"
  # Retry settings for GeminiClient (can be overridden by BaseLLMClient's defaults if not set)
  retry_attempts: 3
  retry_min_wait_seconds: 2
  retry_max_wait_seconds: 10
  # Optional: random delay between calls to the same provider (not per key rotation yet)
  # request_delay_min_seconds: 0.05
  # request_delay_max_seconds: 0.2

# openai_config: # Settings for OpenAI provider (or OpenAI-compatible like Ollama)
  # Commented out as we are removing OpenAI for this fork
  # api_key: "YOUR_OPENAI_API_KEY_IF_NOT_IN_ENV_OR_OLLAMA_PLACEHOLDER"
  # base_url: null
  # default_text_model: "gpt-3.5-turbo"
  # default_embedding_model: "text-embedding-3-small"

# anthropic_config:
#   Commented out
#   api_key: "YOUR_ANTHROPIC_API_KEY_IF_NOT_IN_ENV"
