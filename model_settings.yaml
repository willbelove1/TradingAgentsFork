# --- Langchain ChatModel Instances Configuration ---
# All instances will now use Google provider for this fork.
langchain_chat_models:
  # Google Gemini Instances
  quick_google_lc: { provider: "google", model_name: "gemini-1.5-flash" } # Standard quick thinker
  deep_google_lc:  { provider: "google", model_name: "gemini-1.0-pro" } # Standard deep thinker
  # If specific agents need even more powerful models like 1.5 Pro, define another key:
  # premium_deep_google_lc: { provider: "google", model_name: "gemini-1.5-pro" }

  # OpenAI Instances - Commented out
  # quick_openai_lc: { provider: "openai", model_name: "gpt-3.5-turbo" }
  # deep_openai_lc:  { provider: "openai", model_name: "gpt-4" }


# --- Agent/Component Specific Model Configurations ---
# All agents/components will now default to or explicitly use "google" provider.
agent_model_configs:
  MarketAnalyst:
    # llm_provider: "google" # Uses top-level default
    llm_instance_key: "quick_google_lc"
    prompt_key: "MarketAnalystLC"
  SocialMediaAnalyst:
    llm_instance_key: "quick_google_lc"
    prompt_key: "SocialMediaAnalystLC"
  NewsAnalyst: # Was OpenAI, now Google
    # llm_provider: "google"
    llm_instance_key: "quick_google_lc" # Changed from quick_openai_lc
    prompt_key: "NewsAnalystLC"
  FundamentalsAnalyst:
    llm_instance_key: "standard_google_lc" # Assuming standard_google_lc is defined or deep_google_lc is used
                                         # For now, model_settings.yaml has quick and deep. Let's use deep for this.
                                         # Or we can create a 'standard_google_lc' if needed.
                                         # Let's assume 'deep_google_lc' is suitable for "standard" detail level for now.
    prompt_key: "FundamentalsAnalystLC"

  BullResearcher:
    llm_instance_key: "quick_google_lc"
    prompt_key: "BullResearcherLC"
  BearResearcher:
    llm_instance_key: "quick_google_lc"
    prompt_key: "BearResearcherLC"
  ResearchManager:
    llm_instance_key: "deep_google_lc"
    prompt_key: "ResearchManagerLC"

  Trader: # Was OpenAI, now Google
    # llm_provider: "google"
    llm_instance_key: "deep_google_lc" # Changed from quick_openai_lc, using deep for Trader
    prompt_key: "TradeDecision"

  RiskyDebator:
    llm_instance_key: "quick_google_lc"
    prompt_key: "RiskyDebatorLC"
  NeutralDebator:
    llm_instance_key: "quick_google_lc"
    prompt_key: "NeutralDebatorLC"
  SafeDebator:
    llm_instance_key: "quick_google_lc"
    prompt_key: "SafeDebatorLC"
  RiskManager: # Was OpenAI, now Google
    # llm_provider: "google"
    llm_instance_key: "deep_google_lc" # Changed from deep_openai_lc
    prompt_key: "RiskManagerLC"

  # Components using BaseLLMClient directly:
  Reflector:
    # llm_provider: "google" # Uses top-level default
    model: "gemini-1.0-pro"
    prompt_key: "ReflectorTask"
    temperature: 0.6
    max_tokens: 2048
  SignalProcessor: # Was OpenAI, now Google
    # llm_provider: "google"
    model: "gemini-1.5-flash" # Changed from gpt-3.5-turbo
    prompt_key: "SignalProcessorTask"
    temperature: 0.1
    max_tokens: 25

  FinancialSituationMemory:
    # If this component needs a specific provider for embeddings:
    llm_provider: "google"
    # embedding_model_override: "custom-embedding-model-for-memory" # If needed

  InterfaceFunctions: # For LLM calls made directly from dataflows/interface.py
    llm_provider: "google"
    model: "gemini-1.5-flash"
    temperature: 0.7
    max_tokens: 1024
